 Bonus\n- Demo eager loading (with) vs lazy loading: lihat tab Demo, query nomor 3 di Tinker.\n- Filament admin panel: belum dikerjakan.\n"}, {"path": "database/migrations/2026_10_13_000001_create_categories_table.php", "code": "<?php\n\nuse Illuminate\\Database\\Migrations\\Migration;\nuse Illuminate\\Database\\Schema\\Blueprint;\nuse Illuminate\\Support\\Facades\\Schema;\n\nreturn new class extends Migration\n{\n    public function up(): void\n    {\n        Schema::create('categories', function (Blueprint $table) {\n            $table->id();\n            $table->string('name');\n            $table->string('slug')->unique();\n            $table->timestamps();\n        });\n    }\n\n    public function down(): void\n    {\n        Schema::dropIfExists('categories');\n    }\n};\n"}, {"path": "database/migrations/2026_10_13_000002_create_products_table.php", "code": "<?php\n\nuse Illuminate\\Database\\Migrations\\Migration;\nuse Illuminate\\Database\\Schema\\Blueprint;\nuse Illuminate\\Support\\Facades\\Schema;\n\nreturn new class extends Migration\n{\n    public function up(): void\n    {\n        Schema::create('products', function (Blueprint $table) {\n            $table->id();\n            $table->foreignId('category_id')->constrained()->cascadeOnDelete();\n            $table->foreignId('user_id')->constrained()->cascadeOnDelete();\n            $table->string('name');\n            $table->string('slug')->unique();\n            $table->text('description')->nullable();\n            $table->unsignedInteger('price');\n            $table->unsignedInteger('stock')->default(0);\n            $table->boolean('is_active')->default(true);\n            $table->timestamps();\n        });\n    }\n\n    public function down(): void\n    {\n        Schema::dropIfExists('products');\n    }\n};\n"}, {"path": "database/migrations/2026_10_13_000003_create_orders_table.php", "code": "<?php\n\nuse Illuminate\\Database\\Migrations\\Migration;\nuse Illuminate\\Database\\Schema\\Blueprin );\n        });\n    }\n\n    public function down(): void\n    {\n        Schema::dropIfExists('tags');\n    }\n};\n"}, {"path": "database/migrations/2026_10_13_000006_create_product_tag_table.php", "code": "<?php\n\nuse Illuminate\\Database\\Migrations\\Migration;\nuse Illuminate\\Database\\Schema\\Blueprint;\nuse Illuminate\\Support\\Facades\\Schema;\n\nreturn new class extends Migration\n{\n    public function up(): void\n    {\n        Schema::create('product_tag', function (Blueprint $table) {\n            $table->foreignId('product_id')->constrained()->cascadeOnDelete();\n            $table->foreignId('tag_id')->constrained()->cascadeOnDelete();\n            $table->primary(['product_id', 'tag_id']); // tabel pivot many-to-many\n        });\n    }\n\n    public function down(): void\n    {\n        Schema::dropIfExists('product_tag');\n    }\n};\n"}, {"path": "database/migrations/2026_10_13_000007_create_posts_table.php", "code": "<?php\n\nuse Illuminate\\Database\\Migrations\\Migration;\nuse Illuminate\\Database\\Schema\\Blueprint;\nuse Illuminate\\Support\\Facades\\Schema;\n\nreturn new class extends Migration\n{\n    public function up(): void\n    {\n        Schema::create('posts', function (Blueprint $table) {\n            $table->id();\n            $table->foreignId('user_id')->constrained()->cascadeOnDelete();\n            $table->string('title', 150);\n            $table->text('body');\n            $table->timestamps();\n        });\n    }\n\n    public function down(): void\n    {\n        Schema::dropIfExists('posts');\n    }\n};\n"}, {"path": "database/migrations/2026_10_13_000008_add_role_to_users_table.php", "code": "<?php\n\nuse Illuminate\\Database\\Migrations\\Migration;\nuse Illuminate\\Database\\Schema\\Blueprint;\nuse Illuminate\\Support\\Facades\\Schema;\n\nreturn new class extends Migration\n{\n    public function up(): void\n    {\n        Schema::table('users', function (Blueprint $table) {\n            $table->enum('role', ['admin', 'editor', 'user'])->default('user')->after('email');\n        });\n    }\n\n    public function down(): void\n    {\n        Schema::table('users', function (Blueprint $table) {\n            $table->dropColumn('role');\n        });\n    }\n};\n"}, {"path": "app/Models/User.php (tambahan)", "code": "// Tambahkan ke app/Models/User.php bawaan Breeze:\n\nuse Illuminate\\Database\\Eloquent\\Relations\\HasMany;\n\nprotected $fillable = ['name', 'email', 'password', 'role'];\n\npublic function isAdmin(): bool\n{\n    return $this->role === 'admin';\n}\n\npublic function posts(): HasMany\n{\n    return $this->hasMany(Post::class);\n}\n\npublic function orders(): HasMany\n{\n    return $this->hasMany(Order::class);\n}\n\npublic function products(): HasMany\n{\n    return $this->hasMany(Product::class);\n}\n"}, {"path": "app/Models/Category.php", "code": "<?php\n\nnamespace App\\Models;\n\nuse Illuminate\\Database\\Eloquent\\Model;\nuse Illuminate\\Database\\Eloquent\\Relations\\{BelongsTo, HasMany};\n\nclass Category extends Model\n{\n    protected $fillable = ['name', 'slug'];\n\n    public function products(): HasMany\n    {\n        return $this->hasMany(Product::class);\n    }\n}\n"}, {"path": "app/Models/Product.php", "code": "<?php\n\nnamespace App\\Models;\n\nuse Illuminate\\Database\\Eloquent\\Builder;\nuse Illuminate\\Database\\Eloquent\\Factories\\HasFactory;\nuse Illuminate\\Database\\Eloquent\\Model;\nuse Illuminate\\Database\\Eloquent\\Relations\\{BelongsTo, BelongsToMany, HasMany};\n\nclass Product extends Model\n{\n    use HasFactory;\n\n    protected $fillable = ['category_id', 'user_id', 'name', 'slug', 'description', 'price', 'stock', 'is_active'];\n\n    protected $casts = ['is_active' => 'boolean'];\n\n    public function category(): BelongsTo\n    {\n        return $this->belongsTo(Category::class);\n    }\n\n    public function user(): BelongsTo\n    {\n        return $this->belongsTo(User::class);\n    }\n\n    public function tags(): BelongsToMany\n    {\n        return $this->belongsToMany(Tag::class); // pivot: product_tag\n    }\n\n    public function orderItems(): HasMany\n    {\n        return $this->hasMany(OrderItem::class);\n    }\n\n    // Local scopes\n    public function scopeActive(Builder $query): Builder\n    {\n        return $query->where('is_active', true);\n    }\n\n    public function scopeInStock(Builder $query): Builder\n    {\n        return $query->where('stock', '>', 0);\n    }\n\n    public function scopePriceBetween(Builder $query, int $min, int $max): Builder\n    {\n        return $query->whereBetween('price', [$min, $max]);\n    }\n}\n"}, {"path": "app/Models/Tag.php", "code": "<?php\n\nnamespace App\\Models;\n\nuse Illuminate\\Database\\Eloquent\\Model;\nuse Illuminate\\Database\\Eloquent\\Relations\\BelongsToMany;\n\nclass Tag extends Model\n{\n    protected $fillable = ['name'];\n\n    public function products(): BelongsToMany\n    {\n        return $this->belongsToMany(Product::class);\n    }\n}\n"}, {"path": "app/Models/Order.php", "code": "<?php\n\nnamespace App\\Models;\n\nuse Illuminate\\Database\\Eloquent\\Model;\nuse Illuminate\\Database\\Eloquent\\Relations\\{BelongsTo, HasMany};\n\nclass Order extends Model\n{\n    protected $fillable = ['user_id', 'code', 'total', 'status'];\n\n    public function user(): BelongsTo\n    {\n        return $this->belongsTo(User::class);\n    }\n\n    public function items(): HasMany\n    {\n        return $this->hasMany(OrderItem::class);\n    }\n}\n"}, {"path": "app/Models/OrderItem.php", "code": "<?php\n\nnamespace App\\Models;\n\nuse Illuminate\\Database\\Eloquent\\Model;\nuse Illuminate\\Database\\Eloquent\\Relations\\{BelongsTo, HasMany};\n\nclass OrderItem extends Model\n{\n    protected $fillable = ['order_id', 'product_id', 'quantity', 'price'];\n\n    public function order(): BelongsTo\n    {\n        return $this->belongsTo(Order::class);\n    }\n\n    public function product(): BelongsTo\n    {\n        return $this->belongsTo(Product::class);\n    }\n}\n"}, {"path": "app/Models/Post.php", "code": "<?php\n\nnamespace App\\Models;\n\nuse Illuminate\\Database\\Eloquent\\Model;\nuse Illuminate\\Database\\Eloquent\\Relations\\{BelongsTo, HasMany};\n\nclass Post extends Model\n{\n    protected $fillable = ['user_id', 'title', 'body'];\n\n    public function user(): BelongsTo\n    {\n        return $this->belongsTo(User::class);\n    }\n}\n"}, {"path": "database/factories/ProductFactory.php", "code": "<?php\n\nnamespace Database\\Factories;\n\nuse App\\Models\\Category;\nuse App\\Models\\User;\nuse Illuminate\\Database\\Eloquent\\Factories\\Factory;\nuse Illuminate\\Support\\Str;\n\nclass ProductFactory extends Factory\n{\n    public function definition(): array\n    {\n        $jenis  = ['Kemeja', 'Kaos', 'Hoodie', 'Jaket', 'Celana Chino', 'Sepatu Sneakers', 'Tas Ransel', 'Topi', 'Jam Tangan', 'Dompet Kulit'];\n        $varian = ['Slim Fit', 'Oversize', 'Classic', 'Urban', 'Premium', 'Basic', 'Vintage', 'Sport'];\n        $warna  = ['Hitam', 'Navy', 'Abu-abu', 'Putih', 'Olive', 'Cokelat'];\n\n        $nama = fake()->randomElement($jenis).' '.fake()->randomElement($varian).' '.fake()->randomElement($warna);\n\n        return [\n            'category_id' => Category::inRandomOrder()->value('id'),\n            'user_id'     => User::inRandomOrder()->value('id'),\n            'name'        => $nama,\n            'slug'        => Str::slug($nama).'-'.fake()->unique()->numberBetween(1000, 9999),\n            'description' => fake()->paragraph(2),\n            'price'       => fake()->numberBetween(35, 850) * 1000,\n            'stock'       => fake()->numberBetween(0, 120),\n            'is_active'   => fake()->boolean(90),\n        ];\n    }\n}\n"}, {"path": "database/seeders/DatabaseSeeder.php", "code": "<?php\n\nnamespace Database\\Seeders;\n\nuse App\\Models\\{Category, Post, Product, Tag, User};\nuse Illuminate\\Database\\Seeder;\nuse Illuminate\\Support\\Str;\n\nclass DatabaseSeeder extends Seeder\n{\n    public function run(): void\n    {\n        // Password semua akun: \"password\" (otomatis di-hash oleh cast 'hashed')\n        $admin  = User::create(['name' => 'Ardi Admin',  'email' => 'admin@toko.test',  'password' => 'password', 'role' => 'admin']);\n        $editor = User::create(['name' => 'Eko Editor',  'email' => 'editor@toko.test', 'password' => 'password', 'role' => 'editor']);\n        $user   = User::create(['name' => 'Ulfa User',   'email' => 'user@toko.test',   'password' => 'password', 'role' => 'user']);\n\n        foreach (['Pakaian', 'Sepatu', 'Tas', 'Aksesori', 'Elektronik'] as $nama) {\n            Category::create(['name' => $nama, 'slug' => Str::slug($nama)]);\n        }\n\n        foreach (['Terlaris', 'Diskon', 'Baru', 'Eksklusif', 'Ramah Lingkungan'] as $nama) {\n            Tag::create(['name' => $nama]);\n        }\n\n        Product::factory(60)->create();\n\n        // Hubungkan tiap produk dengan 1-2 tag (tabel pivot product_tag)\n        Product::all()->each(\n            fn (Product $p) => $p->tags()->attach(Tag::inRandomOrder()->take(rand(1, 2))->pluck('id'))\n        );\n\n        // Post #1 milik user, #2 milik editor, #3 milik admin\n        Post::create(['user_id' => $user->id,   'title' => 'Tips Memilih Ukuran Sepatu', 'body' => 'Ukur kaki di sore hari karena ukurannya sedikit membesar.']);\n        Post::create(['user_id' => $editor->id, 'title' => 'Promo Akhir Pekan',          'body' => 'Diskon hingga 30% untuk kategori Pakaian.']);\n        Post::create(['user_id' => $admin->id,  'title' => 'Jadwal Maintenance',         'body' => 'Toko offline Minggu pukul 01.00-03.00.']);\n    }\n}\n"}, {"path": "app/Http/Middleware/RoleMiddleware.php", "code": "<?php\n\nnamespace App\\Http\\Middleware;\n\nuse Closure;\nuse Illuminate\\Http\\Request;\nuse Symfony\\Component\\HttpFoundation\\Response;\n\nclass RoleMiddleware\n{\n    // Pemakaian di route: ->middleware('role:admin,editor')\n    public function handle(Request $request, Closure $next, string ...$roles): Response\n    {\n        $user = $request->user();\n\n        if (! $user || ! in_array($user->role, $roles, true)) {\n            abort(403, 'Anda tidak memiliki akses ke halaman ini.');\n        }\n\n        return $next($request);\n    }\n}\n"}, {"path": "bootstrap/app.php (tambahan)", "code": "// Di dalam bootstrap/app.php, pada ->withMiddleware(...):\n\n->withMiddleware(function (Middleware $middleware) {\n    $middleware->alias([\n        'role' => \\App\\Http\\Middleware\\RoleMiddleware::class,\n    ]);\n})\n"}, {"path": "app/Policies/PostPolicy.php", "code": "<?php\n\nnamespace App\\Policies;\n\nuse App\\Models\\Post;\nuse App\\Models\\User;\n\n// Laravel menemukan policy ini otomatis (Post -> PostPolicy).\n// Desain role: admin = semua akses, editor = edit semua post, user = hanya post miliknya.\nclass PostPolicy\n{\n    // Dijalankan lebih dulu: admin boleh semuanya.\n    public function before(User $user, string $ability): ?bool\n    {\n        return $user->isAdmin() ? true : null;\n    }\n\n    // Semua user yang login boleh menulis post.\n    public function create(User $user): bool\n    {\n        return true;\n    }\n\n    // Editor boleh mengedit semua post; user hanya post miliknya.\n    public function update(User $user, Post $post): bool\n    {\n        return $user->role === 'editor' || $user->id === $post->user_id;\n    }\n\n    // Hapus lebih ketat: hanya pemilik post (admin lewat before()).\n    public function delete(User $user, Post $post): bool\n    {\n        return $user->id === $post->user_id;\n    }\n}\n"}, {"path": "app/Http/Controllers/PostController.php", "code": "<?php\n\nnamespace App\\Http\\Controllers;\n\nuse App\\Models\\Post;\nuse Illuminate\\Http\\RedirectResponse;\nuse Illuminate\\Http\\Request;\nuse Illuminate\\Support\\Facades\\Gate;\nuse Illuminate\\View\\View;\n\nclass PostController extends Controller\n{\n    public function index(): View\n    {\n        return view('posts.index', ['posts' => Post::with('user')->latest()->get()]);\n    }\n\n    public function create(): View\n    {\n        Gate::authorize('create', Post::class);\n\n        return view('posts.form', ['post' => new Post()]);\n    }\n\n    public function store(Request $request): RedirectResponse\n    {\n        Gate::authorize('create', Post::class);\n        $request->user()->posts()->create($this->validated($request));\n\n        return redirect()->route('posts.index')->with('status', 'Artikel dibuat.');\n    }\n\n    public function edit(Post $post): View\n    {\n        Gate::authorize('update', $post);\n\n        return view('posts.form', compact('post'));\n    }\n\n    public function update(Request $request, Post $post): RedirectResponse\n    {\n        Gate::authorize('update', $post);\n        $post->update($this->validated($request));\n\n        return redirect()->route('posts.index')->with('status', 'Artikel diperbarui.');\n    }\n\n    public function destroy(Post $post): RedirectResponse\n    {\n        Gate::authorize('delete', $post);\n        $post->delete();\n\n        return redirect()->route('posts.index')->with('status', 'Artikel dihapus.');\n    }\n\n    private function validated(Request $request): array\n    {\n        return $request->validate([\n            'title' => ['required', 'string', 'max:150'],\n            'body'  => ['required', 'string'],\n        ]);\n    }\n}\n"}, {"path": "routes/web.php (tambahan)", "code": "// Tambahkan di bawah route bawaan Breeze (dashboard, profile), sebelum require auth.php:\n\nuse App\\Http\\Controllers\\PostController;\nuse App\\Models\\{Order, Post, Product, User};\n\nRoute::middleware('auth')->group(function () {\n    // Semua user yang login: lihat, tulis, lalu edit/hapus lewat PostPolicy.\n    Route::resource('posts', PostController::class)->except(['show']);\n\n    // Panel editor: admin dan editor\n    Route::middleware('role:admin,editor')->get('/editor', function () {\n        return view('editor.index', ['posts' => Post::with('user')->latest()->get()]);\n    })->name('editor.index');\n\n    // Panel admin: hanya admin\n    Route::middleware('role:admin')->get('/admin', function () {\n        return view('admin.index', [\n            'users'    => User::count(),\n            'products' => Product::count(),\n            'orders'   => Order::count(),\n        ]);\n    })->name('admin.index');\n});\n"}, {"path": "resources/views/posts/index.blade.php", "code": "<x-app-layout>\n    <x-slot name=\"header\">\n        <h2 class=\"font-semibold text-xl text-gray-800\">Pengumuman Toko<\/h2>\n    <\/x-slot>\n\n    <div class=\"py-8 max-w-4xl mx-auto sm:px-6 lg:px-8 space-y-4\">\n        @if (session('status'))\n            <p class=\"text-green-700\">{{ session('status') }}<\/p>\n        @endif\n\n        @can('create', App\\Models\\Post::class)\n            <a href=\"{{ route('posts.create') }}\" class=\"underline\">Tulis pengumuman<\/a>\n        @endcan\n\n        @foreach ($posts as $post)\n            <article class=\"bg-white p-4 rounded shadow-sm\">\n                <h3 class=\"font-semibold\">{{ $post->title }}<\/h3>\n                <p class=\"text-sm text-gray-600\">{{ $post->body }}<\/p>\n                <p class=\"text-xs text-gray-500 mt-2\">oleh {{ $post->user->name }}<\/p>\n\n                <div class=\"flex gap-4 mt-2 text-sm\">\n                    @can('update', $post)\n                        <a href=\"{{ route('posts.edit', $post) }}\" class=\"underline\">Edit<\/a>\n                    @endcan\n                    @can('delete', $post)\n                        <form method=\"POST\" action=\"{{ route('posts.destroy', $post) }}\">\n                            @csrf\n                            @method('DELETE')\n                            <button class=\"text-red-600 underline\">Hapus<\/button>\n                        <\/form>\n                    @endcan\n                <\/div>\n            <\/article>\n        @endforeach\n    <\/div>\n<\/x-app-layout>\n"}, {"path": "resources/views/posts/form.blade.php", "code": "<x-app-layout>\n    <x-slot name=\"header\">\n        <h2 class=\"font-semibold text-xl text-gray-800\">{{ $post->exists ? 'Edit' : 'Tulis' }} pengumuman<\/h2>\n    <\/x-slot>\n\n    <form method=\"POST\" class=\"py-8 max-w-4xl mx-auto sm:px-6 lg:px-8 space-y-4\"\n          action=\"{{ $post->exists ? route('posts.update', $post) : route('posts.store') }}\">\n        @csrf\n        @if ($post->exists) @method('PUT') @endif\n\n        <div>\n            <x-input-label for=\"title\" value=\"Judul\" />\n            <x-text-input id=\"title\" name=\"title\" class=\"block w-full\" :value=\"old('title', $post->title)\" />\n            <x-input-error :messages=\"$errors->get('title')\" class=\"mt-1\" />\n        <\/div>\n        <div>\n            <x-input-label for=\"body\" value=\"Isi\" />\n            <textarea id=\"body\" name=\"body\" rows=\"5\" class=\"block w-full border-gray-300 rounded-md\">{{ old('body', $post->body) }}<\/textarea>\n            <x-input-error :messages=\"$errors->get('body')\" class=\"mt-1\" />\n        <\/div>\n        <x-primary-button>Simpan<\/x-primary-button>\n    <\/form>\n<\/x-app-layout>\n"}, {"path": "resources/views/admin/index.blade.php", "code": "<x-app-layout>\n    <x-slot name=\"header\">\n        <h2 class=\"font-semibold text-xl text-gray-800\">Panel Admin<\/h2>\n    <\/x-slot>\n\n    <div class=\"py-8 max-w-4xl mx-auto sm:px-6 lg:px-8 text-gray-800\">\n        Pengguna: {{ $users }} &middot; Produk: {{ $products }} &middot; Pesanan: {{ $orders }}\n    <\/div>\n<\/x-app-layout>\n"}, {"path": "resources/views/editor/index.blade.php", "code": "<x-app-layout>\n    <x-slot name=\"header\">\n        <h2 class=\"font-semibold text-xl text-gray-800\">Panel Editor<\/h2>\n    <\/x-slot>\n\n    <div class=\"py-8 max-w-4xl mx-auto sm:px-6 lg:px-8 space-y-2 text-gray-800\">\n        @foreach ($posts as $post)\n            <div class=\"bg-white p-3 rounded shadow-sm flex justify-between\">\n                <span>{{ $post->title }} <small class=\"text-gray-500\">oleh {{ $post->user->name }}<\/small><\/span>\n                <a href=\"{{ route('posts.edit', $post) }}\" class=\"underline text-sm\">Edit<\/a>\n            <\/div>\n        @endforeach\n    <\/div>\n<\/x-app-layout>\n"}, {"path": "docs/tinker-queries.md", "code": "# 5 Query Tinker (php artisan tinker)\n\n# 1. Scope berantai: produk aktif, ada stok, harga 100rb-300rb\n>>> App\\Models\\Product::active()->inStock()->priceBetween(100000, 300000)->count();\n\n# 2. Filter lewat relasi: produk kategori Elektronik\n>>> App\\Models\\Product::whereRelation('category', 'name', 'Elektronik')->get(['id', 'name', 'price']);\n\n# 3. Eager loading + agregasi: jumlah produk per kategori\n>>> App\\Models\\Category::withCount('products')->get(['id', 'name']);\n\n# 4. Many-to-many: tag milik produk pertama\n>>> App\\Models\\Product::with('tags')->first()->tags->pluck('name');\n\n# 5. Transaksi lewat relasi: buat pesanan, tambah item, hitung total\n>>> $u = App\\Models\\User::where('email', 'user@toko.test')->first();\n>>> $o = $u->orders()->create(['code' => 'INV-0001']);\n>>> $p = App\\Models\\Product::first();\n>>> $o->items()->create(['product_id' => $p->id, 'quantity' => 2, 'price' => $p->price]);\n>>> $o->update(['total' => $o->items()->get()->sum(fn ($i) => $i->quantity * $i->price)]);\n\n# Ambil screenshot terminal untuk tiap query dan lampirkan di repo.\n"}], "readme": "# TugasWeb-P11-EcommerceAuth\n\nBagian A: database e-commerce (7 tabel) dengan Eloquent. Bagian B: autentikasi Breeze,\nmulti-role, custom middleware, dan Policy.\n\n## Instalasi\n1. composer create-project laravel/laravel tugasweb-p11 && cd tugasweb-p11\n2. Buat database `tugasweb_p11`, atur DB_* di .env. Tambahkan juga:  APP_FAKER_LOCALE=id_ID\n3. Breeze:\n     composer require laravel/breeze --dev\n     php artisan breeze:install blade\n     npm install && npm run dev        (biarkan jalan di terminal terpisah)\n4. Buat file pendukung:\n     php artisan make:model Category -m   (dan Product, Order, OrderItem, Tag, Post; atau salin dari repo ini)\n     php artisan make:factory ProductFactory\n     php artisan make:middleware RoleMiddleware\n     php artisan make:policy PostPolicy --model=Post\n5. Salin migration, model, factory, seeder, middleware, policy, controller, view, dan route\n   dari tab \"Kode proyek\". Untuk file bertanda (tambahan), tempel ke file bawaan.\n6. php artisan migrate:fresh --seed\n7. php artisan serve\n\n## Akun uji (password: password)\nadmin@toko.test   role admin   (akses /admin dan semua data)\neditor@toko.test  role editor  (edit semua post)\nuser@toko.test    role user    (hanya post miliknya)\n\n## Skema database: 7 tabel\nusers . categories . products . orders . order_items . tags . product_tag (pivot)\n(tabel posts ditambahkan untuk PostPolicy)\nproducts   n--1 categories, n--1 users (foreignId category_id dan user_id)\nproducts   n--n tags lewat product_tag\norders     n--1 users, 1--n order_items\norder_items n--1 products (qty + price)\nrestrictOnDelete pada order_items.product_id agar riwayat pesanan tidak hilang.\n\n## Bagian A: pemetaan requirement\n1. Migrations 7 tabel + FK         database/migrations/*_000001 s.d. 000006 (+ users bawaan Laravel)\n2. Seeder + factory 50+ produk     DatabaseSeeder, ProductFactory (60 produk)\n3. Model + relationship + scope    app/Models/*, Product::scopeActive/InStock/PriceBetween\n4. 5 query Tinker                  docs/tinker-queries.md (screenshot dilampirkan di docs/)\n\n## Bagian B: pemetaan requirement\n5. Breeze login/register/logout    php artisan breeze:install blade\n6. Multi-role + custom middleware  kolom users.role, RoleMiddleware (alias 'role')\n7. PostPolicy edit/delete          app/Policies/PostPolicy.php\n8. Route protection + pengujian    lihat tabel pengujian di bawah\n\n## Desain role\nadmin  : akses /admin, /editor, dan semua data (Policy::before)\neditor : akses /editor, boleh mengedit semua post, menghapus hanya post sendiri\nuser   : hanya mengedit dan menghapus post miliknya\n\n## Pengujian (buka 2 jendela: normal dan incognito, login dengan role berbeda)\nPost #1 milik user, #2 milik editor, #3 milik admin.\n| Request                    | Tamu   | user | editor | admin |\n|----------------------------|--------|------|--------|-------|\n| GET /posts/create          | /login | 200  | 200    | 200   |\n| edit post #1 (milik user)  | /login | 200  | 200    | 200   |\n| edit post #3 (milik admin) | /login | 403  | 200    | 200   |\n| hapus post #1 (milik user) | /login | 200  | 403    | 200   |\n| GET /editor                | /login | 403  | 200    | 200   |\n| GET /admin                 | /login | 403  | 403    | 200   |\n\n## Bonus\n- Demo eager loading (with) vs lazy loading: lihat tab Demo, query nomor 3 di Tinker.\n- Filament admin panel: belum dikerjakan.\n", "demoHtml": "\n<h2 style=\"margin-top:0\">Simulator akses per role<\/h2>\n<div class=\"seg\" id=\"roles\" role=\"group\" aria-label=\"Pilih role\"><\/div>\n<div class=\"res\" id=\"out\"><\/div>\n<p class=\"lead\" style=\"margin:8px 0 0;font-size:.9rem\">Aturan yang disimulasikan sama dengan kode: middleware <code>auth<\/code>, <code>role:...<\/code>, dan <code>PostPolicy<\/code>. Post #1 milik Ulfa (user), #2 milik Eko (editor), #3 milik Ardi (admin).<\/p>\n\n<h2>Eager loading vs lazy loading<\/h2>\n<div class=\"seg\"><button id=\"lz\">Lazy: Product::all()<\/button><button id=\"eg\">Eager: Product::with('category')->get()<\/button><\/div>\n<div id=\"ql\"><\/div>\n", "demoJs": "\nvar roles=[['guest','Tamu'],['user','user (Ulfa)'],['editor','editor (Eko)'],['admin','admin (Ardi)']],cur='guest';\nvar reqs=[['GET','/posts/create'],['PUT','/posts/1  (milik Ulfa)'],['PUT','/posts/3  (milik Ardi)'],['DELETE','/posts/1  (milik Ulfa)'],['GET','/editor'],['GET','/admin']];\nfunction chk(r,i){\n if(r==='guest')return[302,'Dialihkan ke /login oleh middleware auth'];\n if(i===0)return[200,'Semua user yang login boleh menulis post'];\n if(i===1)return r==='user'?[200,'PostPolicy::update: pemilik post']:r==='editor'?[200,'PostPolicy::update: editor boleh edit semua']:[200,'Policy::before: admin boleh semuanya'];\n if(i===2)return r==='user'?[403,'PostPolicy::update: post #3 bukan milik user ini']:r==='editor'?[200,'PostPolicy::update: editor boleh edit semua']:[200,'Policy::before: admin boleh semuanya'];\n if(i===3)return r==='user'?[200,'PostPolicy::delete: pemilik post']:r==='editor'?[403,'PostPolicy::delete: post #1 bukan milik editor ini']:[200,'Policy::before: admin boleh semuanya'];\n if(i===4)return r==='user'?[403,'RoleMiddleware: role user tidak diizinkan']:[200,'role:admin,editor terpenuhi'];\n return r==='admin'?[200,'role:admin terpenuhi']:[403,'RoleMiddleware: hanya admin']}\nfunction show(){\n var S=document.getElementById('roles');S.innerHTML='';\n roles.forEach(function(x){var b=document.createElement('button');b.textContent=x[1];b.setAttribute('aria-pressed',x[0]===cur);b.onclick=function(){cur=x[0];show()};S.appendChild(b)});\n document.getElementById('out').innerHTML=reqs.map(function(q,i){var c=chk(cur,i);return '<span class=\"pill p'+c[0]+'\">'+c[0]+'<\/span><code>'+q[0]+' '+q[1]+'<\/code><span>'+esc(c[1])+'<\/span>'}).join('')}\nshow();\nvar QL=document.getElementById('ql');\nfunction run(eager){var n=60,cats=5,lines=[],total;\n if(eager){lines=['select * from products','select * from categories where id in (1, 2, 3, 4, 5)'];total=2}\n else{lines=['select * from products'];for(var i=1;i<=3;i++)lines.push('select * from categories where id = '+((i*2)%cats+1)+' limit 1  -- produk #'+i);lines.push('... (57 query serupa)');total=n+1}\n QL.innerHTML='<p style=\"margin:0 0 6px\"><b>'+total+' query<\/b> untuk '+n+' produk '+(eager?'(selesai dalam 2 query)':'(masalah N+1)')+'<\/p><div class=\"bar2\" style=\"width:'+Math.max(2,total/61*100)+'%\"><\/div><pre class=\"log\" style=\"margin-top:10px\">'+esc(lines.join('\\n'))+'<\/pre><p class=\"lead\" style=\"font-size:.9rem\">'+(eager?'with() mengambil semua kategori sekaligus, lalu mencocokkannya di memori.':'Setiap $produk->category memicu query baru. Perbaiki dengan with(\\'category\\').')+'<\/p>'}\ndocument.getElementById('lz').onclick=function(){run(false)};\ndocument.getElementById('eg').onclick=function(){run(true)};\nrun(false);\n"}</script>
<script>
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
var V=document.getElementById('view'),T=document.getElementById('tabs'),P=document.getElementById('prog');
var KEY='tr-'+D.id,st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
var tab='ringkasan',cur=D.files[0].path,TABS=[['ringkasan','Ringkasan'],['kode','Kode proyek'],['readme','README'],['demo','Demo']];
function prog(){var n=D.reqs.filter(function(_,i){return st[i]}).length;P.textContent=n+' dari '+D.reqs.length+' requirement sudah kamu uji'}
function copy(text,btn){var done=function(){var o=btn.textContent;btn.textContent='Tersalin';setTimeout(function(){btn.textContent=o},1400)};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,fb)}else fb();
 function fb(){var a=document.createElement('textarea');a.value=text;document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){}a.remove()}}
function tabs(){T.innerHTML='';TABS.forEach(function(t){var b=document.createElement('button');b.textContent=t[1];b.setAttribute('role','tab');b.setAttribute('aria-selected',t[0]===tab);b.onclick=function(){tab=t[0];draw()};T.appendChild(b)})}
function ringkasan(){
 V.innerHTML='<p class="lead">'+esc(D.lead)+'</p><h2>Requirement</h2><ul class="req">'+D.reqs.map(function(r,i){return '<li><label><input type="checkbox" data-i="'+i+'"'+(st[i]?' checked':'')+'><span><b>'+esc(r.t)+'</b><small>'+r.f.map(function(f){return '<button class="lnk" data-f="'+esc(f)+'">'+esc(f)+'</button>'}).join('')+'</small></span></label></li>'}).join('')+'</ul>'+
 '<h2>Bonus yang sudah dikerjakan</h2><ul class="bul">'+D.bonus.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'+
 '<h2>Bagian yang harus kamu kerjakan sendiri</h2><ul class="bul warn">'+D.todo.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>';
 V.querySelectorAll('input[type=checkbox]').forEach(function(c){c.onchange=function(){st[c.dataset.i]=c.checked;save();prog()}});
 V.querySelectorAll('.lnk').forEach(function(b){b.onclick=function(e){e.preventDefault();e.stopPropagation();cur=b.dataset.f;tab='kode';draw()}})}
function kode(){
 var f=D.files.filter(function(x){return x.path===cur})[0]||D.files[0];
 V.innerHTML='<div class="code-wrap"><div class="files" role="list"></div><div class="cbox"><div class="cbar"><span></span><button>Salin file</button></div><pre class="code"></pre></div></div>';
 var L=V.querySelector('.files');
 D.files.forEach(function(x){var b=document.createElement('button');b.textContent=x.path;b.setAttribute('aria-current',x.path===f.path);b.onclick=function(){cur=x.path;kode()};L.appendChild(b)});
 V.querySelector('.cbar span').textContent=f.path;V.querySelector('pre').textContent=f.code;
 V.querySelector('.cbar button').onclick=function(){copy(f.code,this)}}
function readme(){V.innerHTML='<div class="cbox"><div class="cbar"><span>README.md</span><button>Salin README</button></div><pre class="code" style="white-space:pre-wrap"></pre></div>';
 V.querySelector('pre').textContent=D.readme;V.querySelector('.cbar button').onclick=function(){copy(D.readme,this)}}
function demo(){V.innerHTML=D.demoHtml;try{new Function(D.demoJs)()}catch(e){V.insertAdjacentHTML('beforeend','<p class="note">Demo gagal dimuat: '+esc(e.message)+'</p>')}}
function draw(){tabs();({ringkasan:ringkasan,kode:kode,readme:readme,demo:demo})[tab]();prog()}
draw();
})();
</script>
</body>
</html>
